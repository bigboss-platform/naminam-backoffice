# Local MongoDB for development — `docker compose up -d`
# Los Antojitos de Santanita: own container, port 27018 and volume, so it never mixes with Ñami Ñam.
# Data persists in the named volume `santanita-mongo-data` (survives `docker compose down`;
# `docker compose down -v` wipes it).
services:
  mongo:
    image: mongo:7
    container_name: santanita-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-santanita}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-santanita-dev}
    volumes:
      - santanita-mongo-data:/data/db
    # Keep the container small — this machine has little RAM
    command: ["--wiredTigerCacheSizeGB", "0.25"]

volumes:
  santanita-mongo-data:
